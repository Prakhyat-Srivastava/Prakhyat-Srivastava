<text x="58" y="115" fill="#EAF2FF" font-size="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" letter-spacing="-1">Prakhyat Nandan</text>
<text x="58" y="168" fill="#EAF2FF" font-size="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" letter-spacing="-1">Srivastava<tspan fill="#57D9EF">.</tspan></text>
<text x="60" y="209" fill="#AFC6D9" font-size="19">DATA ANALYST / BI / APPLIED ML</text>
