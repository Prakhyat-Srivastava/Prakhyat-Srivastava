<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
<title id="title">Prakhyat Nandan Srivastava — Data Analyst</title>
<desc id="desc">Data analysis, business intelligence and applied machine learning. A decorative cyan data network connects raw data to insight on a deep navy background.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#102638"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#57D9EF"/><stop offset="1" stop-color="#56E0BB"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#57D9EF" stop-opacity=".16"/><stop offset="1" stop-color="#57D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#32546A" stroke-opacity=".18"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
.flow{stroke-dasharray:9 230;animation:flow 7s linear 2}.pulse{animation:pulse 7s ease-in-out 2}
@keyframes flow{to{stroke-dashoffset:-478}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style>
